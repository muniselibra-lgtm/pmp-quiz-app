<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP Exam Prep Quiz</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border: #e2e8f0;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 40px;
            transition: all 0.3s ease;
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }

        h1 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-light);
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s;
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-light);
        }

        .btn:disabled {
            background-color: var(--border);
            color: var(--text-light);
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .progress-bar {
            background-color: var(--border);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--primary-light);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Quiz Question Styles */
        .scenario {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 25px;
            color: var(--text);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-item {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option-item:hover {
            border-color: var(--primary-light);
            background-color: #eff6ff;
        }

        .option-item.selected {
            border-color: var(--primary);
            background-color: #dbeafe;
        }

        .option-radio {
            margin-top: 4px;
        }

        /* Results Screen Styles */
        .score-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .review-section {
            margin-top: 40px;
            border-top: 2px solid var(--border);
            padding-top: 30px;
        }

        .review-title {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 20px;
        }

        .review-item {
            background: var(--background);
            border-left: 4px solid var(--border);
            padding: 20px;
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-bottom: 25px;
        }

        .review-item.correct-match {
            border-left-color: var(--success);
        }

        .review-item.incorrect-match {
            border-left-color: var(--error);
        }

        .review-q {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .review-ans {
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        .review-ans span {
            font-weight: 600;
        }

        .explanation {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            font-size: 0.95rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>PMP® Exam Practice Quiz</h1>
            <p class="subtitle">Test your knowledge with real-world project management scenarios aligned with the PMBOK® Guide principles.</p>
            <button class="btn" id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="progress-container">
                <div class="progress-text">
                    <span id="question-number">Question 1 of 5</span>
                    <span id="progress-percent">0% Complete</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <div id="question-container">
                <p id="question-text" class="scenario"></p>
                <ul id="options-container" class="options-list"></ul>
            </div>

            <button class="btn" id="next-btn" disabled>Next</button>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <h1>Quiz Completed!</h1>
            <div id="score-text" class="score-display"></div>
            <button class="btn" id="restart-btn">Retake Quiz</button>

            <div class="review-section">
                <h2 class="review-title">Question Breakdown & Explanations</h2>
                <div id="review-container"></div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
// --- FIRST SET: QUESTIONS 1-10 ---
  {
    question: "A project manager is leading a hybrid project to implement a new customer relationship management system. The technical team is using agile delivery for configuration and testing, while procurement and compliance activities follow a predictive approach. During a steering committee meeting, a senior stakeholder complains that the team is “moving too fast without enough documentation,” while the product owner says the current governance process is slowing delivery. What should the project manager do next?",
    options: [
      "Stop the agile work until all documentation is completed and approved",
      "Tailor the governance approach to align documentation needs with delivery cadence and stakeholder expectations",
      "Ask the sponsor to choose either agile or predictive so the team can follow one method consistently",
      "Continue with the current approach because hybrid projects always create temporary confusion"
    ],
    answer: "Tailor the governance approach to align documentation needs with delivery cadence and stakeholder expectations",
    explanation: "A hybrid project requires the project manager to tailor the approach so that governance, documentation, and delivery practices match the project context. The concern here is not that agile or predictive is wrong; it is that stakeholder needs and governance expectations are not yet properly integrated. The best next step is to align documentation expectations, compliance needs, and delivery cadence in a way that preserves value delivery while satisfying oversight requirements."
  },
  {
    question: "A project manager notices growing tension between two senior team members. One leads infrastructure work and the other leads application development. Their disagreement over environment readiness is beginning to delay integration testing, and other team members are taking sides. What should the project manager do first?",
    options: [
      "Escalate the issue to the functional managers because senior specialists are involved",
      "Reassign one of the team members to reduce conflict on the project",
      "Facilitate a discussion to identify the root cause and align both leads on project objectives",
      "Document the conflict in the issue log and monitor the situation for another week"
    ],
    answer: "Facilitate a discussion to identify the root cause and align both leads on project objectives",
    explanation: "This is primarily a People domain question focused on conflict management and team leadership. The project manager should address conflict early and directly by facilitating a productive discussion, identifying root causes, and helping both leads refocus on shared project objectives. PMP exam logic generally favors resolving conflict at the lowest appropriate level before escalating."
  },
  {
    question: "A predictive project is in execution. A key stakeholder asks for a new reporting feature that would provide significant operational value. The stakeholder insists it is a small change and wants the team to begin immediately. The project manager reviews the request and sees that the feature may affect scope, schedule, and testing. What should the project manager do next?",
    options: [
      "Direct the team to implement the feature because it offers business value",
      "Submit the request through integrated change control and assess impacts before approval",
      "Reject the request because scope has already been baselined",
      "Add the feature to lessons learned for consideration in future projects"
    ],
    answer: "Submit the request through integrated change control and assess impacts before approval",
    explanation: "In a predictive environment with baselined scope, a requested enhancement that may affect scope, schedule, and testing should go through integrated change control. The project manager must assess impacts before implementation and ensure proper review and authorization. This protects project governance while still allowing beneficial changes to be considered."
  },
  {
    question: "An agile team has completed three iterations of a product development effort. Velocity is declining, team morale is dropping, and several stories are being carried over from one iteration to the next. During the retrospective, team members say priorities keep changing in the middle of the sprint. What should the project manager or scrum master recommend?",
    options: [
      "Increase the sprint length so the team has more time to complete stories",
      "Freeze all changes to the backlog until the release is complete",
      "Work with the product owner to protect the sprint backlog from mid-sprint changes",
      "Replace underperforming team members to restore velocity quickly"
    ],
    answer: "Work with the product owner to protect the sprint backlog from mid-sprint changes",
    explanation: "In agile, once a sprint begins, the sprint backlog should be protected from unnecessary mid-sprint changes. If priorities are constantly changing during the sprint, the team cannot reliably complete committed work, velocity declines, and morale suffers. The project manager or scrum master should work with the product owner to preserve sprint focus and manage changing priorities through the product backlog."
  },
  {
    question: "A project manager is assigned to a global project with team members across four countries. Although all milestones are being met, misunderstandings are frequent during handoffs, and one region says decisions are being made without enough local input. What is the best action for the project manager?",
    options: [
      "Standardize communication only through email so all instructions are documented",
      "Create or update the communications management approach to reflect time zones, language needs, and decision pathways",
      "Ask regional leads to solve communication issues locally without changing the overall project approach",
      "Reduce meeting frequency to avoid confusion caused by too many discussions"
    ],
    answer: "Create or update the communications management approach to reflect time zones, language needs, and decision pathways",
    explanation: "On a global project, communication needs should be intentionally tailored to address time zones, cultural expectations, language differences, and decision rights. Updating the communications management approach is the strongest response because it creates a structured, scalable solution rather than relying on ad hoc fixes."
  },
  {
    question: "A project manager is working on a government-regulated construction project. Midway through execution, a new environmental regulation is enacted. Compliance will require design modifications and could affect both schedule and cost baselines. What should the project manager do first?",
    options: [
      "Update the schedule baseline immediately to reflect the likely delay",
      "Ignore the regulation until the client formally requests compliance",
      "Assess the impact of the regulatory change and engage the appropriate change and compliance processes",
      "Ask the team to work overtime to absorb the compliance effort without changing baselines"
    ],
    answer: "Assess the impact of the regulatory change and engage the appropriate change and compliance processes",
    explanation: "This question falls under Business Environment because an external regulatory change affects the project. The first step is to assess impact and trigger the proper compliance and change processes. The project manager must understand the effect on scope, design, schedule, cost, and stakeholder obligations before updating baselines or taking corrective action."
  },
  {
    question: "A newly formed agile team includes several experienced technical experts, but they are unfamiliar with agile ways of working. During sprint planning, the team waits for the project manager to assign tasks and estimate effort. This is slowing planning and reducing ownership. Which of the following represents the best combination of actions for the project manager to take? (Select the best multi-action option)",
    options: [
      "Continue assigning work until the team becomes more comfortable, and escalate the issue to the sponsor",
      "Replace the planning meeting with individual manager-led assignments to save time",
      "Coach the team on self-organization / collaborative estimation, and facilitate team agreements clarifying agile roles and norms",
      "Escalate the team's lack of agility to the sponsor while continuing to assign tasks directly"
    ],
    answer: "Coach the team on self-organization / collaborative estimation, and facilitate team agreements clarifying agile roles and norms",
    explanation: "This scenario addresses agile team development. A team new to agile often needs coaching to shift from manager-directed work to self-organization. The two best actions are to coach the team on self-organization and collaborative estimation, and to facilitate team agreements clarifying agile roles, responsibilities, and norms. These actions build capability and ownership rather than reinforcing dependency."
  },
  {
    question: "A project manager is overseeing a product modernization initiative. Executive leadership wants benefits realized quickly, but the organization also requires formal phase-gate reviews for funding release. The team can deliver usable features incrementally. Which combination of approaches is most appropriate to meet both requirements? (Select the best multi-action option)",
    options: [
      "Delay all user-facing releases until the entire solution passes final governance review using a predictive approach",
      "Use a hybrid life cycle that delivers incrementally while retaining phase-gate governance, and map increments to checkpoints",
      "Eliminate governance reviews entirely to prioritize fast value delivery as requested by the executives",
      "Use a purely predictive framework because executives requested business value quickly"
    ],
    answer: "Use a hybrid life cycle that delivers incrementally while retaining phase-gate governance, and map increments to checkpoints",
    explanation: "A hybrid approach is most appropriate when the organization requires formal governance while the team can deliver value incrementally. Using a hybrid life cycle and mapping increments to governance checkpoints allows the project to satisfy funding controls and still realize benefits early. This reflects realistic PMP exam thinking: tailor the approach to business and governance needs."
  },
  {
    question: "A sponsor tells the project manager that a major competitor has launched a similar product. The sponsor now wants to accelerate delivery of the highest-value features and defer lower-priority functionality. The project is currently planned using a predictive approach, and detailed plans exist for all scope. What should the project manager recommend?",
    options: [
      "Keep the original plan because changing direction mid-project will reduce control",
      "Rebaseline the project immediately without further analysis",
      "Review priorities with stakeholders and evaluate whether a hybrid or incremental delivery approach would better meet business needs",
      "Add more resources to complete the full original scope faster"
    ],
    answer: "Review priorities with stakeholders and evaluate whether a hybrid or incremental delivery approach would better meet business needs",
    explanation: "The sponsor’s request reflects a shift in market conditions and business priorities. The project manager should revisit scope priorities with stakeholders and evaluate whether a hybrid or incremental approach would better support faster delivery of high-value features. This is a strategic response that aligns the project with evolving business needs instead of rigidly following the original plan."
  },
  {
    question: "Match each project manager action to its appropriate focus area: (1) Resolving team disagreement through discussion, (2) Reviewing scope change impact on schedule/cost, (3) Aligning project to a new regulatory requirement, (4) Establishing feedback loops for iterative delivery. Which mapping is correct?",
    options: [
      "1-People, 2-Process, 3-Business Environment, 4-Delivery Approach (A)",
      "1-Process, 2-People, 3-Delivery Approach, 4-Business Environment (B)",
      "1-People, 2-Business Environment, 3-Process, 4-Delivery Approach (C)",
      "1-Delivery Approach, 2-Process, 3-Business Environment, 4-People (D)"
    ],
    answer: "1-People, 2-Process, 3-Business Environment, 4-Delivery Approach (A)",
    explanation: "1-A: Resolving disagreement between key team members is a People focus. 2-B: Reviewing the impact of a requested scope change on schedule and cost is a Process focus. 3-C: Aligning the project to a new regulation is a Business Environment focus. 4-D: Establishing feedback loops and backlog refinement belongs to Delivery Approach, especially agile or iterative delivery."
  },

  // --- SECOND SET: QUESTIONS 11-20 (Questions 1-10 from Document Part 2) ---
  {
    question: "A high-performing agile team member suddenly starts missing daily standup meetings and delivering sub-par code, which is delaying the sprint goals. Other team members are expressing frustration about picking up the slack. What should the project manager do first?",
    options: [
      "Address the performance issue during the next sprint retrospective so the entire team can discuss it.",
      "Meet privately with the team member to understand the root cause of the sudden change in performance.",
      "Escalate the issue to the team member's functional manager to initiate a performance improvement plan.",
      "Reassign the team member’s pending tasks to more reliable team members to protect the current sprint velocity."
    ],
    answer: "Meet privately with the team member to understand the root cause of the sudden change in performance.",
    explanation: "A sudden drop in a high-performing team member's output indicates an underlying issue (personal, professional, or burnout). Servant leadership and agile principles dictate that the project manager (or Scrum Master) should first approach the individual privately to show empathy, understand the root cause, and offer support before escalating or involving the group."
  },
  {
    question: "A multi-year hybrid project is entering its execution phase. The hardware component follows a predictive lifecycle with fixed milestones, while the software component uses an agile framework. During a steering committee review, a key stakeholder voices confusion about how progress is being tracked across the two distinct methodologies. What should the project manager do?",
    options: [
      "Standardize the reporting by requiring the software team to use Earned Value Management (EVM) milestones instead of burnup charts.",
      "Ask the stakeholder to attend daily standups and sprint reviews to stay updated on the software development progress.",
      "Establish an integrated dashboard that maps agile sprint velocities and release milestones against predictive project phases.",
      "Request that the PMO take over stakeholder communication due to the complexity of the hybrid tracking mechanisms."
    ],
    answer: "Establish an integrated dashboard that maps agile sprint velocities and release milestones against predictive project phases.",
    explanation: "In a hybrid environment, the project manager serves as the bridge between different delivery frameworks. Creating an integrated dashboard allows senior stakeholders to visualize how agile software increments feed into or depend on predictive hardware milestones without forcing either team to abandon their optimized working methods."
  },
  {
    question: "During the execution of a critical pipeline construction project, a newly introduced environmental regulation threatens to halt work unless a specific, non-destructive testing method is utilized. Implementing this method will increase costs by 15%. What should the project manager do next?",
    options: [
      "Issue an immediate stop-work order to prevent compliance violations until a solution is approved.",
      "Allocate funds from the management reserve to cover the increased cost of the testing method.",
      "Submit a formal change request to modify the project management plan and baseline costs.",
      "Direct the procurement team to find a cheaper contractor who can bypass the new regulation legally."
    ],
    answer: "Submit a formal change request to modify the project management plan and baseline costs.",
    explanation: "External regulatory changes represent a shift in the business environment that directly impacts project constraints. In a predictive project, changes to the approved scope, cost, or methods must pass through the formal Change Control Board (CCB) via a structured change request."
  },
  {
    question: "An agile team is experiencing intense conflict during iteration planning regarding which architecture pattern to adopt for a new cloud platform. The discussion is turning personal, and two senior developers are refusing to collaborate. What is the best way for the project manager to handle this situation?",
    options: [
      "Choose the architecture pattern themselves based on their own expert judgment to keep the project on schedule.",
      "Implement the \"Withdraw/Avoid\" technique by postponing the architecture discussion until the next iteration.",
      "Facilitate a collaborative workshop using objective criteria to evaluate both options and guide the team toward a shared decision.",
      "Recommend that the two developers be separated and moved to different agile teams to preserve team harmony."
    ],
    answer: "Facilitate a collaborative workshop using objective criteria to evaluate both options and guide the team toward a shared decision.",
    explanation: "When conflict shifts from professional debate to personal friction, the project manager must intervene to protect team dynamics. Facilitating an objective evaluation workshop helps depersonalize the issue, focusing the team back on technical realities and data-driven criteria."
  },
  {
    question: "A project is underway to develop an autonomous delivery drone. Mid-project, the national aviation authority releases a revised regulatory framework regarding drone flight paths that severely restricts the project's current operating assumptions. What should the project manager do first?",
    options: [
      "Update the issue log and conduct an impact assessment to evaluate how the new regulations affect the project scope, timeline, and budget.",
      "Draft a change request to immediately pivot the project's focus to an international market with fewer restrictions.",
      "Terminate the project since the primary objective violates the newly released national regulatory guidelines.",
      "Continue execution as planned because the project was initiated and approved before the new regulations were enacted."
    ],
    answer: "Update the issue log and conduct an impact assessment to evaluate how the new regulations affect the project scope, timeline, and budget.",
    explanation: "Whenever a major external change occurs (such as a regulatory shift), the project manager's very first step is to document the item in the issue or risk log and perform an objective assessment of its impact on all project constraints before taking action."
  },
  {
    question: "A project manager is managing a hybrid transformation project. The procurement team has finalized a contract with a third-party vendor for a predictive software module, but the internal development team is using Scrum. The vendor delivers late, stalling the internal team’s sprint dependencies. Which two actions are best for the project manager to take? (Select the best combined option)",
    options: [
      "Penalize the vendor financially immediately, and force the internal Scrum team to work overtime.",
      "Immediately cancel the vendor contract, and have the internal team build the module from scratch.",
      "Review the contract terms / SLA obligations for escalation paths, and work with the vendor and product owner to re-prioritize independent backlog items.",
      "Force the vendor to join the daily Scrum meetings, and freeze all internal sprints until delivery is completed."
    ],
    answer: "Review the contract terms / SLA obligations for escalation paths, and work with the vendor and product owner to re-prioritize independent backlog items.",
    explanation: "Reviewing contract terms is essential to understand the legal parameters and formal remedies established with the vendor. Concurrently, working with the product owner to adjust the product backlog ensures the internal team remains productive by shifting focus to non-dependent backlog items while the vendor issue is resolved."
  },
  {
    question: "A complex project involves cross-functional team members from engineering, marketing, and legal departments. The legal team members consistently miss cross-functional workshops, stating that their departmental workload takes precedence over this project. What should the project manager do to resolve this?",
    options: [
      "Remove the legal team tasks from the project scope to avoid further team friction and meeting absences.",
      "Escalate the legal team’s poor attendance to the project sponsor and request senior executive intervention.",
      "Meet with the legal functional manager to review the project charter, align on resource commitments, and optimize meeting schedules.",
      "Log a negative performance review for the specific legal team representatives who skipped the workshops."
    ],
    answer: "Meet with the legal functional manager to review the project charter, align on resource commitments, and optimize meeting schedules.",
    explanation: "In a matrix organization, cross-functional team resources often report to functional managers who control their time and priorities. The project manager must negotiate directly with the functional manager to realign commitments, emphasize the project's strategic value, and find a compromise on scheduling."
  },
  {
    question: "A project manager is analyzing project performance data using Earned Value Management (EVM). The analysis yields a Schedule Performance Index (SPI) of 0.82 and a Cost Performance Index (CPI) of 1.15. Which interpretation of the project status is accurate?",
    options: [
      "The project is ahead of schedule and over budget.",
      "The project is behind schedule and under budget.",
      "The project is ahead of schedule and under budget.",
      "The project is behind schedule and over budget."
    ],
    answer: "The project is behind schedule and under budget.",
    explanation: "An SPI value less than 1.0 (0.82 < 1.0) means the project is progressing at a slower rate than planned, meaning it is behind schedule. A CPI value greater than 1.0 (1.15 > 1.0) indicates that the project is earning more value than it is spending, meaning it is under budget."
  },
  {
    question: "A global manufacturing project is designed to deliver a new eco-friendly packaging line. The company's corporate strategy changes mid-year, prioritizing immediate cost reduction over sustainability initiatives. What should the project manager do?",
    options: [
      "Continue executing the project as chartered, as project goals should remain independent of corporate strategy shifts.",
      "Evaluate the project’s business case against the revised corporate strategy and present the findings to the steering committee.",
      "Immediately stop all project expenditures and wait for the project sponsor to officially cancel the project.",
      "Re-brand the project marketing materials to emphasize cost savings without modifying the actual technical deliverables."
    ],
    answer: "Evaluate the project’s business case against the revised corporate strategy and present the findings to the steering committee.",
    explanation: "Projects exist to deliver value aligned with corporate strategy. When that strategy shifts fundamentally, the project manager must re-evaluate the business case to determine if the project remains viable or requires realignment, and then present those insights to governance bodies (the steering committee)."
  },
  {
    question: "An agile team experiences a drop in performance due to team dysfunctions. Match each symptom to its correct action: (1) Hesitant to voice disagreement/false consensus, (2) Missing goals due to working in individual silos, (3) Blaming errors on external factors. Focus Actions: (A) Team charter alignment for shared accountability, (B) Psychological safety coaching and anonymous polling, (C) Cross-training and paired programming.",
    options: [
      "1-A, 2-B, 3-C",
      "1-B, 2-C, 3-A",
      "1-C, 2-A, 3-B",
      "1-B, 2-A, 3-C"
    ],
    answer: "1-B, 2-C, 3-A",
    explanation: "1 matches B: Hesitation to voice disagreement signals a lack of psychological safety; coaching on vulnerability helps. 2 matches C: Siloed work points to a lack of cross-functional skill sharing; pairing breaks down silos. 3 matches A: Blaming external factors indicates low accountability; a team charter reinforces that the team succeeds or fails together."
  },

  // --- THIRD SET: QUESTIONS 21-30 (Questions 1-20 from Document Part 3) ---
  {
    question: "A high-performing agile team member has missed several standup meetings over the last two weeks, and their sprint velocity has noticeably dropped. Other team members are starting to express frustration about picking up the slack. What should the project manager do first?",
    options: [
      "Address the issue during the upcoming sprint retrospective to get the team’s collective input.",
      "Meet with the team member privately to understand the root cause of the sudden change in performance.",
      "Inform the functional manager about the drop in performance and ask for a replacement resource.",
      "Set up a team meeting to re-verify the working agreements and reinforce accountability."
    ],
    answer: "Meet with the team member privately to understand the root cause of the sudden change in performance.",
    explanation: "A servant leader addresses performance issues with empathy and curiosity first. Meeting privately allows the project manager to discover if there are personal, professional, or technical issues blocking the team member before jumping to disciplinary or public actions."
  },
  {
    question: "A company is transitioning from a predictive to a hybrid project management framework. During execution, a key stakeholder complains that they are no longer receiving the massive, comprehensive monthly status reports they are used to. How should the project manager handle this situation?",
    options: [
      "Continue sending the comprehensive monthly reports to this specific stakeholder to maintain engagement.",
      "Explain that hybrid projects use automated, lightweight dashboards and refuse to create custom reports.",
      "Review the communications management plan and meet with the stakeholder to align their information needs with hybrid reporting cadences.",
      "Instruct the product owner to include report generation as a recurring item in the sprint backlog."
    ],
    answer: "Review the communications management plan and meet with the stakeholder to align their information needs with hybrid reporting cadences.",
    explanation: "In a hybrid transition, stakeholders often experience anxiety over changing visibility tools. The project manager must review communication needs, respect the stakeholder's engagement value, and bridge the gap by matching what information they actually need with the available artifacts in the new hybrid ecosystem."
  },
  {

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionNumber = document.getElementById('question-number');
        const progressPercent = document.getElementById('progress-percent');
        const progressFill = document.getElementById('progress-fill');
        const scoreText = document.getElementById('score-text');
        const reviewContainer = document.getElementById('review-container');

        // Event Listeners
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', handleNextQuestion);
        restartBtn.addEventListener('click', resetQuiz);

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            nextBtn.disabled = true;
            const currentQuestion = questions[currentQuestionIndex];
            
            // Update progress elements
            const totalQuestions = questions.length;
            const currentNum = currentQuestionIndex + 1;
            const percentage = Math.round(((currentQuestionIndex) / totalQuestions) * 100);
            
            questionNumber.textContent = `Question ${currentNum} of ${totalQuestions}`;
            progressPercent.textContent = `${percentage}% Complete`;
            progressFill.style.width = `${percentage}%`;

            // Display Question Text
            questionText.textContent = currentQuestion.question;

            // Display Options
            optionsContainer.innerHTML = '';
            currentQuestion.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `
                    <input type="radio" name="pmp-option" id="opt-${index}" class="option-radio" value="${index}">
                    <label for="opt-${index}" style="cursor:pointer; width:100%;">${option}</label>
                `;
                
                li.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(li);
            });
        }

        function selectOption(selectedIndex) {
            const items = optionsContainer.querySelectorAll('.option-item');
            items.forEach((item, index) => {
                if(index === selectedIndex) {
                    item.classList.add('selected');
                    item.querySelector('input').checked = true;
                } else {
                    item.classList.remove('selected');
                }
            });
            nextBtn.disabled = false;
        }

        function handleNextQuestion() {
            const selectedRadio = document.querySelector('input[name="pmp-option"]:checked');
            const answerIndex = parseInt(selectedRadio.value);
            
            userAnswers.push(answerIndex);
            if (answerIndex === questions[currentQuestionIndex].correct) {
                score++;
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            const percentage = Math.round((score / questions.length) * 100);
            scoreText.textContent = `Your Score: ${score} / ${questions.length} (${percentage}%)`;

            reviewContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const isCorrect = userAnswers[index] === q.correct;
                const reviewItem = document.createElement('div');
                reviewItem.className = `review-item ${isCorrect ? 'correct-match' : 'incorrect-match'}`;

                reviewItem.innerHTML = `
                    <p class="review-q">${index + 1}. ${q.question}</p>
                    <p class="review-ans" style="color: ${isCorrect ? 'var(--success)' : 'var(--error)'}">
                        <span>Your Answer:</span> ${q.options[userAnswers[index]]}
                    </p>
                    ${!isCorrect ? `
                    <p class="review-ans" style="color: var(--success)">
                        <span>Correct Answer:</span> ${q.options[q.correct]}
                    </p>` : ''}
                    <div class="explanation">
                        <strong>Explanation:</strong> ${q.explanation}
                    </div>
                `;
                reviewContainer.appendChild(reviewItem);
            });
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            resultsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
