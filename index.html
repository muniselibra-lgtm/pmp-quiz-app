<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP Exam Prep Quiz</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border: #e2e8f0;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 40px;
            transition: all 0.3s ease;
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }

        h1 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-light);
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s;
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-light);
        }

        .btn:disabled {
            background-color: var(--border);
            color: var(--text-light);
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .progress-bar {
            background-color: var(--border);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--primary-light);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Quiz Question Styles */
        .scenario {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 25px;
            color: var(--text);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-item {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .option-item:hover {
            border-color: var(--primary-light);
            background-color: #eff6ff;
        }

        .option-item.selected {
            border-color: var(--primary);
            background-color: #dbeafe;
        }

        .option-radio {
            margin-top: 4px;
        }

        /* Results Screen Styles */
        .score-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .review-section {
            margin-top: 40px;
            border-top: 2px solid var(--border);
            padding-top: 30px;
        }

        .review-title {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 20px;
        }

        .review-item {
            background: var(--background);
            border-left: 4px solid var(--border);
            padding: 20px;
            border-radius: 0 var(--radius) var(--radius) 0;
            margin-bottom: 25px;
        }

        .review-item.correct-match {
            border-left-color: var(--success);
        }

        .review-item.incorrect-match {
            border-left-color: var(--error);
        }

        .review-q {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .review-ans {
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        .review-ans span {
            font-weight: 600;
        }

        .explanation {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            font-size: 0.95rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>PMP® Exam Practice Quiz</h1>
            <p class="subtitle">Test your knowledge with real-world project management scenarios aligned with the PMBOK® Guide principles.</p>
            <button class="btn" id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="progress-container">
                <div class="progress-text">
                    <span id="question-number">Question 1 of 5</span>
                    <span id="progress-percent">0% Complete</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <div id="question-container">
                <p id="question-text" class="scenario"></p>
                <ul id="options-container" class="options-list"></ul>
            </div>

            <button class="btn" id="next-btn" disabled>Next</button>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <h1>Quiz Completed!</h1>
            <div id="score-text" class="score-display"></div>
            <button class="btn" id="restart-btn">Retake Quiz</button>

            <div class="review-section">
                <h2 class="review-title">Question Breakdown & Explanations</h2>
                <div id="review-container"></div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "A project manager is managing a software deployment project using an agile approach. During a iteration review, the product owner requests a new feature that was not part of the initial release plan. What should the project manager do next?",
                options: [
                    "Refuse the request because it introduces scope creep outside the sprint goal.",
                    "Ask the product owner to add the requirement to the product backlog for prioritization.",
                    "Direct the development team to stop their current tasks and evaluate the new requirement immediately.",
                    "Submit a formal change request to the Change Control Board (CCB) for approval."
                ],
                correct: 1,
                explanation: "In agile methodologies, new requirements are welcomed but must be routed through the product backlog. The Product Owner is responsible for maintaining the backlog and prioritizing features based on business value. A Change Control Board (CCB) is a predictive/waterfall mechanism and does not apply to standard sprint refinement actions."
            },
            {
                question: "During a hybrid project's execution phase, a key stakeholder complains that they are receiving too many highly technical updates that are not relevant to their department. The project manager reviews the project documentation. Which document should be modified to resolve this issue?",
                options: [
                    "Stakeholder Engagement Plan",
                    "Communications Management Plan",
                    "Resource Management Plan",
                    "Project Charter"
                ],
                correct: 1,
                explanation: "The Communications Management Plan outlines how, when, and in what format project information will be distributed to various stakeholders. Since the stakeholder is receiving an incorrect volume or depth of communication, this plan needs to be updated to better align with their specific informational needs."
            },
            {
                question: "A critical project activity is running behind schedule due to unexpected resource constraints. The project manager realizes that delaying this activity will delay the entire project completion date. Which technique should the project manager use to get the project back on track without changing the project scope?",
                options: [
                    "Scope reduction",
                    "Fast-tracking",
                    "Crashing",
                    "Resource leveling"
                ],
                correct: 2,
                explanation: "Crashing is a schedule compression technique used to shorten the schedule duration for the least incremental cost by adding resources (e.g., overtime or additional staff). Fast-tracking involves performing phases or activities in parallel that are normally done in sequence, but it increases risk. Resource leveling often extends the schedule, and scope reduction changes the scope, which contradicts the question constraints."
            },
            {
                question: "A project manager is appointed to a global project with team members located across four different time zones. During initial team syncs, misunderstandings frequently occur due to cultural nuances and varying communication styles. What should the project manager establish to address this challenge?",
                options: [
                    "A strict disciplinary policy for communication errors",
                    "A revised Responsibility Assignment Matrix (RAM)",
                    "Team Charter guidelines outlining communication norms",
                    "Daily 24-hour mandatory overlap standup meetings"
                ],
                correct: 2,
                explanation: "A Team Charter is a document that records the team values, agreements, and operating guidelines. Establishing communication norms, ground rules, and expectations within a collaborative team charter early on helps cross-cultural and virtual teams align and reduces friction."
            },
            {
                question: "Near the end of a construction project, the project manager notices that a subcontractor has completed their assigned deliverables, but some minor documentation clean-up is missing. The project sponsor wants to immediately reassign the project manager to a new corporate initiative. What should the project manager do?",
                options: [
                    "Hand over the incomplete files to the operational unit and accept the new assignment.",
                    "Ensure administrative closure steps are fully executed and all project files are indexed before leaving.",
                    "Inform the sponsor that they cannot accept the new assignment under any circumstances.",
                    "Let the subcontractor finalize the documentation directly with the client without project manager oversight."
                ],
                correct: 1,
                explanation: "Project closing involves administrative closure actions like archiving project information, completing historical data, and ensuring all documentation is finalized. Even if pressed for time or reassigned by a sponsor, the project manager is fundamentally responsible for professional, structured project closure."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionNumber = document.getElementById('question-number');
        const progressPercent = document.getElementById('progress-percent');
        const progressFill = document.getElementById('progress-fill');
        const scoreText = document.getElementById('score-text');
        const reviewContainer = document.getElementById('review-container');

        // Event Listeners
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', handleNextQuestion);
        restartBtn.addEventListener('click', resetQuiz);

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            nextBtn.disabled = true;
            const currentQuestion = questions[currentQuestionIndex];
            
            // Update progress elements
            const totalQuestions = questions.length;
            const currentNum = currentQuestionIndex + 1;
            const percentage = Math.round(((currentQuestionIndex) / totalQuestions) * 100);
            
            questionNumber.textContent = `Question ${currentNum} of ${totalQuestions}`;
            progressPercent.textContent = `${percentage}% Complete`;
            progressFill.style.width = `${percentage}%`;

            // Display Question Text
            questionText.textContent = currentQuestion.question;

            // Display Options
            optionsContainer.innerHTML = '';
            currentQuestion.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `
                    <input type="radio" name="pmp-option" id="opt-${index}" class="option-radio" value="${index}">
                    <label for="opt-${index}" style="cursor:pointer; width:100%;">${option}</label>
                `;
                
                li.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(li);
            });
        }

        function selectOption(selectedIndex) {
            const items = optionsContainer.querySelectorAll('.option-item');
            items.forEach((item, index) => {
                if(index === selectedIndex) {
                    item.classList.add('selected');
                    item.querySelector('input').checked = true;
                } else {
                    item.classList.remove('selected');
                }
            });
            nextBtn.disabled = false;
        }

        function handleNextQuestion() {
            const selectedRadio = document.querySelector('input[name="pmp-option"]:checked');
            const answerIndex = parseInt(selectedRadio.value);
            
            userAnswers.push(answerIndex);
            if (answerIndex === questions[currentQuestionIndex].correct) {
                score++;
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            const percentage = Math.round((score / questions.length) * 100);
            scoreText.textContent = `Your Score: ${score} / ${questions.length} (${percentage}%)`;

            reviewContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const isCorrect = userAnswers[index] === q.correct;
                const reviewItem = document.createElement('div');
                reviewItem.className = `review-item ${isCorrect ? 'correct-match' : 'incorrect-match'}`;

                reviewItem.innerHTML = `
                    <p class="review-q">${index + 1}. ${q.question}</p>
                    <p class="review-ans" style="color: ${isCorrect ? 'var(--success)' : 'var(--error)'}">
                        <span>Your Answer:</span> ${q.options[userAnswers[index]]}
                    </p>
                    ${!isCorrect ? `
                    <p class="review-ans" style="color: var(--success)">
                        <span>Correct Answer:</span> ${q.options[q.correct]}
                    </p>` : ''}
                    <div class="explanation">
                        <strong>Explanation:</strong> ${q.explanation}
                    </div>
                `;
                reviewContainer.appendChild(reviewItem);
            });
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            resultsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
